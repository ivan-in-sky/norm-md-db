name: convert

on:
  push:
    paths: ["inbox/**", "sources/**"]
  workflow_dispatch:
    inputs:
      batch: { description: "Имя пакета (inbox/<batch>)", required: false }
  schedule: [{ cron: "0 3 * * *" }]        # подбирать inbox по расписанию

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: LibreOffice (для .doc → .docx)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - run: pip install -e tools/

      - name: Прогнать конвертер
        run: |
          mkdir -p md
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            python -m normconv.cli convert "inbox/${{ github.event.inputs.batch }}" --out md --jobs 4
          else
            python -m normconv.cli convert inbox --out md --jobs 4 || true
            python -m normconv.cli convert sources --out md --jobs 4 || true
          fi
          python -m normconv.cli report md

      - name: Линт (только отчёт, не блокирует импорт)
        run: python -m normconv.cli lint md || true

      - name: Каталог и чанки
        run: |
          python -m normconv.cli catalog md --out catalog
          python -m normconv.cli chunk md --out index/chunks.jsonl

      - name: Открыть PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: import/auto-${{ github.run_number }}
          title: "import: автоматическая конвертация из inbox"
          commit-message: "import: автоматическая конвертация"
          body-path: md/_reports/batch.md
          add-paths: |
            md/**
            catalog/**
