[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normconv"
version = "0.1.0"
description = "Конвейер конвертации нормативных документов строительства (СП/ГОСТ/СНиП/РД) в канонический Markdown для RAG"
readme = "../docs/00-overview.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "lxml>=4.9",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "check-jsonschema>=0.28",
  "ruff>=0.5",
]
doc = ["python-docx>=1.1", "mammoth>=1.6"]       # для генерации тестовых документов
pdf = ["pymupdf>=1.24"]                           # привязка пунктов к страницам
ocr = ["docling>=2.0"]                            # путь C: сканы
serve = ["fastapi>=0.110", "uvicorn>=0.29", "qdrant-client>=1.9", "mcp>=1.0"]

[project.scripts]
normconv = "normconv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["normconv*"]

[tool.ruff]
line-length = 110
target-version = "py310"
