# Вопросы для RAG-evals. Минимум 150–300 штук из трёх источников:
#   1) реальные вопросы инженеров;  2) типовые задачи проектирования;
#   3) «ловушки»: отменённые документы, таблицы со слияниями, формулы, отсутствующие в корпусе.
#
# Прогон:  python evals/run_eval.py evals/qa.yaml --index index/chunks.jsonl
# Целевые метрики (docs/04-rag.md §6):
#   hit@5 по документу ≥ 0.90 · hit@5 по пункту ≥ 0.75 · точность цитирования ≥ 0.95
#   доля ссылок на недействующие документы ≤ 0.01 · доля галлюцинаций ≤ 0.03

version: 1

thresholds:
  doc_hit_at_5: 0.90
  clause_hit_at_5: 0.75
  citation_correct: 0.95
  superseded_cited: 0.01
  hallucination_rate: 0.03
  refusal_on_out_of_scope: 0.90

questions:
  - id: q-001
    question: Какой минимальный защитный слой бетона для рабочей арматуры плиты толщиной 100 мм?
    expect_docs: [sp-63-13330-2018]
    expect_clauses: ["10.3.1"]
    expect_answer_contains: ["защитный слой", "мм"]
    difficulty: easy
    tags: [армирование, защитный-слой]

  - id: q-002
    question: Предельный прогиб балки пролётом 7 м по таблице предельных прогибов?
    expect_docs: [sp-999-13330-2026]
    expect_clauses: ["3.1.1"]
    expect_table: sp-999-13330-2026-tbl001
    expect_answer_contains: ["30", "1/250"]
    difficulty: medium
    tags: [таблица, слияния, прогибы]
    note: Проверяет корректность извлечения значения из таблицы с rowspan/colspan

  - id: q-003
    question: Какая снеговая нагрузка для III снегового района?
    expect_docs: [sp-20-13330-2016]
    forbid_docs: [snip-2-01-07-85]
    expect_answer_contains: ["кПа"]
    difficulty: medium
    tags: [ловушка, отменённый-документ]
    note: СНиП 2.01.07-85* отменён — ссылка на него засчитывается как ошибка

  - id: q-004
    question: По какой формуле определяется жёстость элемента с трещинами в растянутой зоне?
    expect_docs: [sp-999-13330-2026]
    expect_clauses: ["3.1.2"]
    expect_formula: sp-999-13330-2026-eq003
    difficulty: hard
    tags: [формула]
    note: Проверяет, что формула отдаётся в LaTeX с расшифровкой обозначений из «где»-блока

  - id: q-005
    question: Каковы требования к огнестойкости несущих стен здания класса Ф1.3 высотой 45 м?
    expect_docs: []
    expect_answer: out_of_scope
    difficulty: trap
    tags: [вне-корпуса, отказ]
    note: Если документа нет в корпусе — агент обязан сказать об этом, а не выдумать
