# Объяснённые расхождения сверки «рабочая версия ↔ эталон» для СП 20.13330.2016.
# Применяется: python -m normconv.compare compare <рабочая> <эталон> \
#                --explained tools/config/sverka-sp-20-13330-2016.yaml
#
# Рабочая версия — консолидированная редакция docs.cntd.ru (Изм. № 1–6 в тексте).
# Эталон — переиздание март 2018 (StroyInf, цифровой слой); сканы Минстроя текста не имеют.
# Пункты 8.3.2 и 8.3.3 исключены последующим изменением (после марта 2018) —
# в эталоне они ещё присутствуют; номер изменения подтвердить при верификации.

- эталон: "8.3.2"
  рабочая: ""
  причина: >-
    Пункт исключён изменением (после переиздания марта 2018); в консолидированной
    редакции docs.cntd.ru отсутствует, пометка «(Исключен…)» — см. заметку и
    excluded_clauses при верификации.

- эталон: "8.3.3"
  рабочая: ""
  причина: >-
    Пункт исключён изменением (после переиздания марта 2018); в консолидированной
    редакции docs.cntd.ru отсутствует, пометка «(Исключен…)» — см. заметку и
    excluded_clauses при верификации.
