# Реестр актуальных версий нормативных документов.
# Используется конвертером, чтобы вики-ссылка вела на ДЕЙСТВУЮЩУЮ редакцию.
# Заполняет локальный агент сверкой с ФГИС СТ (ГОСТ) и реестром ФАУ «ФЦС» (СП).
#
#   <обозначение без года>: <актуальное обозначение>
#
# Пустой/неполный реестр не ломает конвертацию: неизвестная ссылка становится
# «висячей» [[ГОСТ 27751]] — в Obsidian это красная ссылка = «документ ещё не добавлен».

версии:
  ГОСТ 31937: ГОСТ 31937-2024          # был 31937-2011
  СП 22.13330: СП 22.13330.2016
  СП 20.13330: СП 20.13330.2016
  СП 56.13330: СП 56.13330.2021
  СП 16.13330: СП 16.13330.2017
  СП 63.13330: СП 63.13330.2018
  ГОСТ 27751: ГОСТ 27751-2014

# Замена одного документа другим (смена семейства: СНиП -> СП и т.п.).
# Старое обозначение становится алиасом новой заметки, ссылка ведёт на новую.
замены:
  - старый: СНиП 2.02.01-83
    новый: СП 22.13330.2016
  - старый: СНиП 31-03-2001
    новый: СП 56.13330.2021
  - старый: СНиП 2.01.07-85
    новый: СП 20.13330.2016
  - старый: ГОСТ 31937-2011
    новый: ГОСТ 31937-2024
