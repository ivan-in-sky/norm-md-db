# Объяснённые расхождения сверки «рабочая версия ↔ эталон» для ГОСТ 27751-2014.
# Применяется: python -m normconv.compare compare <рабочая> <эталон> \
#                --explained база/правки/сверка-gost-27751-2014.yaml
#
# Рабочая версия — переиздание с Изменением N 1 (экспорт СПС, fkr-spb.ru);
# эталон — исходное издание 2014 г. (PDF МЕГАНОРМ, md27751-ref/).
# Формат записи: эталон = пункт в эталоне; рабочая = соответствующий пункт
# рабочей версии (проверяется, что он реально существует); причина = факт.

- эталон: "12.8"
  рабочая: "12.7*"
  причина: >-
    Изменение N 1 (приказ Росстандарта от 23.12.2022 N 1571-ст) перенумеровало
    п. 12.8 в «12.7*» (звёздочка — отметка издания о тексте, изменённом
    ранее внесённой правкой); содержание сохранено, block ID рабочей версии
    ^c12-7-x. Сверка: _reports/gost-27751-2014-vs-original-2014.md.
